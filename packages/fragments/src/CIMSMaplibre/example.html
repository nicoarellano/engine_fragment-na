<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="https://thatopen.github.io/engine_components/resources/favicon.ico"
    />
    <title>Loading Fragment Models</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow: hidden;
      }

      .full-screen {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      .bim {
        width: 50vw;
        height: 100vh;
        overflow: hidden;
      }

      #map {
        width: 50vw;
        height: 100vh;
        position: absolute;
        top: 0;
        right: 0;
        overflow: hidden;
      }

      #sliders-container {
        position: absolute;
        bottom: 1rem;
        right: 0.5rem;
        width: 180px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .slider-label {
        background-color: rgba(255, 255, 255, 0.5);
        padding: 0.4rem;
        border-radius: 0.5rem;
        font-size: 1rem;
        margin: 0.3rem;
        color: black;
        font-weight: bold;
      }

      .options-menu {
        position: fixed;
        min-width: unset;
        top: 5px;
        right: 5px;
        max-height: calc(100vh - 10px);
        max-width: 15rem;
      }

      .phone-menu-toggler {
        visibility: hidden;
      }

      @media (max-width: 480px) {
        .options-menu {
          visibility: hidden;
          bottom: 5px;
          left: 5px;
          max-width: none;
        }

        .options-menu-visible {
          visibility: visible;
        }

        .phone-menu-toggler {
          visibility: visible;
          position: fixed;
          top: 5px;
          right: 5px;
        }
      }
    </style>
  </head>

  <body>
    <div class="bim" id="container"></div>
    <div id="map"></div>
    <script type="module" src="./example.ts"></script>
    <div id="sliders-container">
      <label class="slider-label" id="angle-label">
        IFC rotation: <span id="angle">0</span>°
      </label>
      <input
        id="angle-slider"
        type="range"
        min="0"
        max="360"
        step="1"
        value="0"
        oninput="document.getElementById('angle').textContent = this.value"
      />
      <label class="slider-label" id="heigh-label">
        IFC elev: <span id="height">0</span> mts
      </label>
      <input
        id="height-slider"
        type="range"
        min="-100"
        max="100"
        step="01"
        value="0"
      />
    </div>
  </body>
</html>
